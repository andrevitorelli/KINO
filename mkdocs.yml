site_name: KINO
site_description: Kinematic lensing inference and mock-observations
repo_url: https://github.com/andrevitorelli/KINO
repo_name: andrevitorelli/KINO

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Manual:
      - Forecasting a target: manual/forecasting.md
      - Adding an instrument config: manual/adding-an-instrument.md
      - Running inference: manual/inference.md
      - Conventions: manual/conventions.md
  - API reference:
      - kino.galaxy: api/galaxy.md
      - kino.lensing: api/lensing.md
      - kino.instruments: api/instruments.md
      - kino.inference: api/inference.md
      - kino.analysis: api/analysis.md
      - kino.observing: api/observing.md
      - kino.io: api/io.md
