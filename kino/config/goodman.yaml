# SOAR Goodman High Throughput Spectrograph (red camera), single slit,
# 930 l/mm grating -- one slitlet of a real instrument (single-slit only:
# kino.instruments.slit.SlitSpectrograph models one slit, not a MOS mask).
#
# UNLIKE kino/config/gmacs.yaml (a fully fiducial "GMACS-like" Phase 7
# concept design on a 24.5 m GMT aperture), the geometry, detector and
# grating numbers below are SOURCED from NOIRLab's own Goodman pages
# (see kino_status_report_2026-09-26.tex / the KINO 2026-09-26 Status Report
# in the Obsidian vault for the full citation list).
#
# THROUGHPUT IS A REAL MEASUREMENT, WITH A GRATING MISMATCH.
# NOIRLab's Goodman red-camera page states its throughput "results will be
# posted soon" (still true as of 2026-09-27) and no published red-camera
# efficiency curve exists for any grating. Rather than guess (an earlier
# version of this file scaled SIFS's own curve by a stated efficiency
# ratio -- see git history), scripts/derive_goodman_throughput.py derives
# a real system throughput from an actual on-sky NOIRLab exposure of the
# spectrophotometric standard EG 21: the RED camera, 400 l/mm grating
# (mode M1), 1.0" slit, airmass 1.41 and 0.77" seeing (all read from the
# FITS header, not assumed), combined with EG 21's independently published
# absolute flux (IRAF/CTIO "ctionewcal" table) and KINO's own extinction
# and PSF/slit-loss models. The numbers below are that script's output.
#
# Caveats (see the script's own docstring for the full list):
#   * WRONG GRATING -- this is 400 l/mm, not the 930 l/mm used below for
#     `lsf`. NOIRLab separately publishes a measured 930/1200 l/mm curve
#     for the *blue* camera (peak ~0.30-0.38, blue-peaked, declining
#     redward -- https://noirlab.edu/science/programs/ctio/instruments/goodman-high-throughput-spectrograph/instrument-characteristics/blue-camera-throughput),
#     which agrees with the derived curve here in shape and magnitude and
#     is the best cross-check available; there is no published 930 l/mm
#     RED-camera curve to compare against directly.
#   * ONE STAR, ONE NIGHT -- NOIRLab's own page notes total counts for the
#     same object/setup vary ~50% night to night (clouds, lunar
#     phase/distance); treat the normalisation as uncertain at that level.
#   * The slit-loss and extinction corrections are KINO's own models
#     (chosen for consistency with how SlitSpectrograph itself renders a
#     mock), not independently verified against this specific observation.
# Treat this as a real anchor, not a certified calibration, until a
# genuine 930 l/mm red-camera standard-star reduction is available.
#
# Geometry: the slit is a single-object aperture within the fixed
# complement of long slits (0.45-10.2 arcsec); 1.0 arcsec is chosen as a
# seeing-limited-typical width (and matches the EG 21 exposure the
# throughput above was derived from). Slit LENGTH here (15 arcsec,
# n_spatial=100) follows the same convention kino/config/gmacs.yaml set
# for a *per-target* single slit -- not the full 3.9 arcmin the physical
# long slits span, which matters for a MOS mask, not a single galaxy's
# spectrum.
#
# Spectral resolution: the 930 l/mm grating gives R=4450 (0.42 A/pix) at
# 550 nm with NOIRLab's reference 0.46 arcsec slit; set as `lsf` below (a
# fixed dispersion-limited resolving power). For a source filling a wider
# slit (as 1.0 arcsec does for most targets) the *true* delivered
# resolution is slit-limited, coarser than this (~2.8 A FWHM at 1.0 arcsec
# per NOIRLab's own numbers) -- kino.instruments.slit does not model that
# slit-width-driven spectral blur separately from the fixed `lsf`, so
# velocity dispersions measured through this config are optimistic by
# roughly that amount. Left as a known idealisation for now (see CLAUDE.md).

slit_width: "1.0 arcsec"        # one of Goodman's fixed long-slit widths
pixel_scale: "0.15 arcsec"      # sourced: unbinned Goodman spectroscopic pixel scale
n_spatial: 100                  # 100 * 0.15" = 15" -- per-target slit length, see header
slit_pa: 0.0                    # degrees, East of North
# slit_offset defaults to (0, 0) -- centred on the target
margin: 10

wavelength_min: "0.49 um"       # centred near [O III] 5007 for z ~ 0-0.02; override per target
wavelength_max: "0.51 um"
n_wave: 476                     # 0.42 A/pix (930 l/mm, sourced) over this 200 A window

lsf:
  resolving_power: 4450         # 930 l/mm grating, 550 nm, 0.46" slit (sourced) -- see header caveat

psf:
  seeing_fwhm: "0.9 arcsec"     # ground-based, seeing-limited (no AO); sweep this, don't trust it
  # defocus, coma*, astig*, trefoil*, spher default to 0.0 (unaberrated optics)

throughput:
  # REAL, from an on-sky EG 21 standard-star exposure -- 400 l/mm grating
  # (not 930), one star, one night. See scripts/derive_goodman_throughput.py
  # and the header above for the derivation and its caveats.
  wavelength: ["0.385 um", "0.415 um", "0.445 um", "0.475 um", "0.505 um", "0.535 um", "0.565 um", "0.595 um", "0.625 um", "0.655 um", "0.685 um"]
  transmission: [0.152, 0.284, 0.278, 0.274, 0.286, 0.278, 0.260, 0.239, 0.208, 0.179, 0.160]

aperture_diameter: "4.1 m"      # SOAR
obstruction_fraction: 0.0       # already netted into throughput/effective diameter above

detector:
  read_noise: "3.89 electron"   # sourced: Goodman red camera, 344ATTN3 readout, 1x1 binning
  dark_current: "0.001 electron / s"  # UNVERIFIED PLACEHOLDER -- no published value found

exposure_time: "1200 s"
n_exposures: 3                  # fiducial 1 hour total integration

sky_electron_rate: "0 electron / s"   # PLACEHOLDER -- use kino.observing.skymodel at forecast time
