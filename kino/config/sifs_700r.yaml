# SOAR Integral Field Spectrograph (SIFS) -- 0.30"/fibre mode, 700 l/mm "R" setup.
#
# UNLIKE sifs.yaml (the 700M setting, with a real measured system throughput),
# this config is for the REDDER 700R setting, needed to reach Halpha above
# z ~ 0.11 (sifs.yaml's own header: "the 700R setting (5000-7800 A), needed for
# Halpha at z > 0.11, has resolution numbers on the page but NO published
# efficiency curve"). Kept as a SEPARATE config rather than extending
# sifs.yaml itself, so the real, measured 700M file (and its pinned test
# values) stays untouched -- see CLAUDE.md's "Instrument configs from partial
# data" convention: prefer a measured proxy over a fiducial guess, and only
# fall back to a documented fiducial when neither exists. A fresh check
# (2026-10-09) for a published 700R efficiency curve or an archival on-sky
# 700R calibration exposure (the kind that let goodman.yaml's throughput be
# derived from a real EG 21 observation) found nothing -- NOIRLab's SIFS
# characteristics page did not render via automated fetch at that time; a
# published curve may still exist. Revisit before trusting any number here.
#
# Sourced (same NOIRLab SIFS characteristics page as sifs.yaml; 700R numbers
# were already noted in sifs.yaml's own header from an earlier read):
#   * 700 l/mm grating, same groove density as 700M -> the SAME 0.69 A/pix
#     dispersion (dispersion is set by groove density, not the blaze/tilt
#     that distinguishes "M" from "R"); 700R covers 5000-7800 A.
#   * Detector, fibre geometry, read noise: identical hardware to sifs.yaml
#     (same spectrograph, different grating tilt only) -- copied from there.
#
# FIDUCIAL (not measured) -- replace before quoting any forecast:
#   * Resolving power: no 700R-specific R is confirmed here, so this reuses
#     700M's R=4200 at 5500 A as a same-order-of-magnitude placeholder (both
#     are 700 l/mm gratings; R should be comparable, not necessarily equal).
#   * Throughput: 700M's own measured curve declines toward its red edge
#     (0.0815 at 450nm to 0.035 at 730nm, see sifs.yaml) with no sign of
#     levelling off; this fiducial HOLDS THAT LAST MEASURED VALUE (0.035)
#     flat from 730nm to 780nm, rather than extrapolating the decline
#     further or assuming the "R" blaze improves things redward -- a
#     deliberately conservative (not optimistic) choice, pending a real
#     700R measurement. Treat any forecast through this config as an
#     order-of-magnitude estimate only.
#   * sky_electron_rate, dark_current, exposure_time/n_exposures, seeing_fwhm:
#     same placeholders as sifs.yaml, see its header.
#
# The wavelength window below is a narrow default; override it (as
# narrowed_ifu/forecast_ifu do) to bracket the redshifted line of the target.

pixel_scale: "0.30 arcsec"
nx: 50
ny: 26

wavelength_min: "0.7400 um"
wavelength_max: "0.7600 um"
n_wave: 290                     # 200 A / 0.69 A per pixel, matching 700M's dispersion

lsf:
  resolving_power: 4200         # FIDUCIAL -- 700M's R, not a confirmed 700R value, see header

psf:
  seeing_fwhm: "0.95 arcsec"

throughput:
  # FIDUCIAL beyond 730nm (flat continuation of 700M's own measured curve's last
  # value) -- see header. The 450-730nm points are 700M's real measured values,
  # included so a target whose line falls there still gets the real curve.
  wavelength: ["0.4500 um", "0.4930 um", "0.5500 um", "0.6000 um", "0.6500 um", "0.7000 um", "0.7300 um", "0.7800 um"]
  transmission: [0.0815, 0.097, 0.088, 0.083, 0.074, 0.0595, 0.035, 0.035]

aperture_diameter: "4.1 m"
obstruction_fraction: 0.0       # efficiency above is overall system, see header

detector:
  read_noise: "3.9 electron"
  dark_current: "0 electron / s"    # PLACEHOLDER, see sifs.yaml's header

exposure_time: "1200 s"
n_exposures: 3                  # fiducial 1 hour total

sky_electron_rate: "0 electron / s"   # PLACEHOLDER -- NO SKY, see sifs.yaml's header
